<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Hard offset shadow -->
  <circle cx="106" cy="106" r="84" fill="#111"/>
  <!-- Outer retro teal ring -->
  <circle cx="100" cy="100" r="84" fill="#0d8a8f" stroke="#111" stroke-width="6"/>
  <!-- Sunburst rays -->
  <circle cx="100" cy="100" r="68" fill="#f6b40e" stroke="#111" stroke-width="5"/>
  <!-- Dial semi-circle -->
  <path d="M40 124 A 60 60 0 0 1 160 124 Z" fill="#fff1d0" stroke="#111" stroke-width="5.5" stroke-linejoin="round"/>
  <!-- Colored gauge arc -->
  <path d="M54 120 A 46 46 0 0 1 100 74" stroke="#2bd96b" stroke-width="12" stroke-linecap="butt"/>
  <path d="M100 74 A 46 46 0 0 1 146 120" stroke="#e0561b" stroke-width="12" stroke-linecap="butt"/>
  <!-- Needle pointing to ~70% -->
  <g transform="rotate(34 100 122)">
    <polygon points="94,122 100,66 106,122" fill="#ff2d8a" stroke="#111" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <circle cx="100" cy="122" r="11" fill="#111"/>
  <circle cx="100" cy="122" r="5" fill="#ffd23f"/>
  <!-- Percent pill at bottom -->
  <rect x="66" y="132" width="68" height="32" rx="10" fill="#fffdf6" stroke="#111" stroke-width="4.5"/>
  <text x="100" y="156" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#111">50%</text>
  <!-- Up/Down arrows -->
  <polygon points="44,54 56,36 68,54" fill="#2bd96b" stroke="#111" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="132,36 144,54 156,36" fill="#ff2d8a" stroke="#111" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
