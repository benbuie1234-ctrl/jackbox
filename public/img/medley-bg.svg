<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="mg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#ff2d8a"/>
      <stop offset="48%" stop-color="#6a2cff"/>
      <stop offset="100%" stop-color="#140842"/>
    </radialGradient>
    <linearGradient id="mbeam1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd23f" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffd23f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mbeam2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ec4ff" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#2ec4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#mg)"/>
  <!-- Triple-color diagonal championship ribbons -->
  <polygon points="0,0 420,0 160,900 0,900" fill="#1638ff" opacity="0.28"/>
