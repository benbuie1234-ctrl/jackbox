  <g fill="#ffd23f" stroke="#111" stroke-width="3">
    <circle cx="140" cy="44" r="11"/><circle cx="300" cy="44" r="11"/><circle cx="460" cy="44" r="11"/><circle cx="620" cy="44" r="11"/><circle cx="780" cy="44" r="11"/><circle cx="940" cy="44" r="11"/><circle cx="1100" cy="44" r="11"/><circle cx="1260" cy="44" r="11"/><circle cx="1420" cy="44" r="11"/>
