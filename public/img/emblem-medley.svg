  <circle cx="100" cy="100" r="84" fill="#6a2cff" stroke="#111" stroke-width="6"/>
  <!-- 3-color pie wedges representing Zinger + Hunch + Tee Time -->
  <clipPath id="mclip"><circle cx="100" cy="100" r="76"/></clipPath>
  <g clip-path="url(#mclip)">
    <polygon points="100,100 100,10 190,145" fill="#ff2d8a"/>
    <polygon points="100,100 190,145 10,145" fill="#f6b40e"/>
