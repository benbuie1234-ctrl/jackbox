  </g>
  <circle cx="100" cy="100" r="76" stroke="#111" stroke-width="5"/>
  <!-- Giant golden championship crown + star -->
  <path d="M46 130 L56 68 L84 96 L100 54 L116 96 L144 68 L154 130 Z" fill="#ffd23f" stroke="#111" stroke-width="5.5" stroke-linejoin="round"/>
  <rect x="48" y="130" width="104" height="18" rx="6" fill="#fffdf6" stroke="#111" stroke-width="5"/>
  <circle cx="56" cy="64" r="8" fill="#ff2d8a" stroke="#111" stroke-width="4"/>
  <circle cx="100" cy="50" r="9" fill="#2ec4ff" stroke="#111" stroke-width="4"/>
