    <circle cx="131" cy="106" r="5.5" fill="#111"/>
  </g>
  <!-- Magnifying glass accent -->
  <g transform="translate(130,118) rotate(-25)">
    <rect x="-4" y="22" width="10" height="28" rx="5" fill="#ffd400" stroke="#111" stroke-width="4"/>
    <circle cx="1" cy="10" r="18" fill="#2ec4ff" fill-opacity="0.7" stroke="#111" stroke-width="5"/>
    <path d="M-7 4 A 10 10 0 0 1 5 -2" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
