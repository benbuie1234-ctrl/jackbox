  <circle cx="100" cy="100" r="84" fill="#1d1d22" stroke="#111" stroke-width="6"/>
  <!-- Caution yellow diagonal stripe behind -->
  <clipPath id="c"><circle cx="100" cy="100" r="80"/></clipPath>
  <g clip-path="url(#c)">
    <rect x="-20" y="128" width="240" height="24" transform="rotate(-10 100 140)" fill="#ffd400" stroke="#111" stroke-width="4"/>
    <path d="M25 144 L45 120 M65 144 L85 120 M105 144 L125 120 M145 144 L165 120" stroke="#111" stroke-width="8"/>
  </g>
  <!-- Fedora hat -->
  <ellipse cx="100" cy="84" rx="64" ry="14" fill="#c8102e" stroke="#111" stroke-width="5"/>
  <path d="M58 80 L68 42 Q100 32 132 42 L142 80 Z" fill="#c8102e" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
  <path d="M62 69 Q100 77 138 69 L140 79 Q100 87 60 79 Z" fill="#ffd400" stroke="#111" stroke-width="4"/>
  <!-- Suspicious squinting eyes -->
  <g>
    <path d="M58 104 Q76 96 92 106 Q76 118 58 104 Z" fill="#fffdf6" stroke="#111" stroke-width="4.5" stroke-linejoin="round"/>
    <circle cx="81" cy="106" r="5.5" fill="#111"/>
