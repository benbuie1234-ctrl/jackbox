<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="fg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#3a1924"/>
      <stop offset="55%" stop-color="#1c1b22"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </radialGradient>
    <linearGradient id="search" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd400" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd400" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#fg)"/>
  <!-- Dramatic diagonal searchlight -->
  <polygon points="360,0 560,0 1280,900 760,900" fill="url(#search)"/>
  <!-- Noir city alley silhouettes left & right -->
  <g fill="#121216" stroke="#111" stroke-width="5">
    <rect x="0" y="140" width="220" height="760"/>
    <rect x="220" y="340" width="120" height="560"/>
    <rect x="1380" y="120" width="220" height="780"/>
    <rect x="1260" y="320" width="120" height="580"/>
  </g>
  <!-- Crimson lit windows -->
  <g fill="#c8102e" stroke="#111" stroke-width="3" opacity="0.7">
    <rect x="44" y="210" width="44" height="64"/><rect x="124" y="210" width="44" height="64"/>
    <rect x="44" y="320" width="44" height="64"/><rect x="124" y="430" width="44" height="64"/>
    <rect x="1428" y="190" width="44" height="64"/><rect x="1508" y="190" width="44" height="64"/>
    <rect x="1508" y="310" width="44" height="64"/><rect x="1428" y="420" width="44" height="64"/>
  </g>
  <!-- Cobblestone wet alley floor -->
  <rect x="0" y="760" width="1600" height="140" fill="#181216" stroke="#111" stroke-width="6"/>
  <ellipse cx="800" cy="830" rx="340" ry="30" fill="#c8102e" opacity="0.22"/>
</svg>
