  <circle cx="80" cy="14" r="9" fill="#ff2d8a" stroke="#111" stroke-width="4.5"/>
  <!-- Ears -->
  <rect x="14" y="66" width="18" height="32" rx="6" fill="#ffd23f" stroke="#111" stroke-width="5"/>
  <rect x="128" y="66" width="18" height="32" rx="6" fill="#ffd23f" stroke="#111" stroke-width="5"/>
