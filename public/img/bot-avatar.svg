  <line x1="68" y1="104" x2="68" y2="118" stroke="#111" stroke-width="3.5"/>
  <line x1="80" y1="104" x2="80" y2="118" stroke="#111" stroke-width="3.5"/>
  <line x1="92" y1="104" x2="92" y2="118" stroke="#111" stroke-width="3.5"/>
</svg>
