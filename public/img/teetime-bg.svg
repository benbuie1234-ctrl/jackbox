<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="tg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#22c79a"/>
      <stop offset="55%" stop-color="#0d7a6e"/>
      <stop offset="100%" stop-color="#072e36"/>
    </radialGradient>
    <linearGradient id="tbeamL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd23f" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffd23f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tbeamR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2d8a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ff2d8a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#tg)"/>
  <!-- Arena trusses & spotlights -->
  <rect x="0" y="0" width="1600" height="34" fill="#111"/>
  <polygon points="180,34 290,34 720,900 100,900" fill="url(#tbeamL)"/>
  <polygon points="1310,34 1420,34 1500,900 880,900" fill="url(#tbeamR)"/>
  <!-- Comic starburst posters on far walls -->
  <polygon points="140,260 170,210 205,255 255,235 225,285 270,320 210,325 190,375 160,325 105,330 135,285 95,250" fill="#ffd23f" stroke="#111" stroke-width="5" opacity="0.7"/>
  <polygon points="1460,260 1430,210 1395,255 1345,235 1375,285 1330,320 1390,325 1410,375 1440,325 1495,330 1465,285 1505,250" fill="#ff2d8a" stroke="#111" stroke-width="5" opacity="0.7"/>
  <!-- T-shirt battle arena mat + ropes -->
  <rect x="0" y="740" width="1600" height="160" fill="#162238" stroke="#111" stroke-width="6"/>
  <line x1="0" y1="670" x2="1600" y2="670" stroke="#111" stroke-width="12"/>
  <line x1="0" y1="670" x2="1600" y2="670" stroke="#ff2d8a" stroke-width="5"/>
  <line x1="0" y1="708" x2="1600" y2="708" stroke="#111" stroke-width="12"/>
  <line x1="0" y1="708" x2="1600" y2="708" stroke="#ffd23f" stroke-width="5"/>
  <!-- Corner turnbuckle posts -->
  <rect x="-6" y="590" width="54" height="220" rx="10" fill="#ff2d8a" stroke="#111" stroke-width="6"/>
  <rect x="1552" y="590" width="54" height="220" rx="10" fill="#ffd23f" stroke="#111" stroke-width="6"/>
</svg>
