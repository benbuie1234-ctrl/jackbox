<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="lg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8b4dff"/>
      <stop offset="55%" stop-color="#5319d6"/>
      <stop offset="100%" stop-color="#220863"/>
    </radialGradient>
    <linearGradient id="beamL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd23f" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffd23f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2d8a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ff2d8a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#lg)"/>
  <!-- Studio arch & marquee wall -->
  <path d="M0 740 Q800 660 1600 740 L1600 900 L0 900 Z" fill="#1b074c" stroke="#111" stroke-width="6"/>
  <!-- Left & right comic studio columns -->
  <rect x="-10" y="0" width="130" height="900" fill="#3a109c" stroke="#111" stroke-width="6"/>
  <rect x="1480" y="0" width="130" height="900" fill="#3a109c" stroke="#111" stroke-width="6"/>
  <!-- Marquee bulbs along side columns -->
  <g fill="#ffd23f" stroke="#111" stroke-width="3">
    <circle cx="55" cy="90" r="11"/><circle cx="55" cy="180" r="11"/><circle cx="55" cy="270" r="11"/><circle cx="55" cy="360" r="11"/><circle cx="55" cy="450" r="11"/><circle cx="55" cy="540" r="11"/><circle cx="55" cy="630" r="11"/><circle cx="55" cy="720" r="11"/>
    <circle cx="1545" cy="90" r="11"/><circle cx="1545" cy="180" r="11"/><circle cx="1545" cy="270" r="11"/><circle cx="1545" cy="360" r="11"/><circle cx="1545" cy="450" r="11"/><circle cx="1545" cy="540" r="11"/><circle cx="1545" cy="630" r="11"/><circle cx="1545" cy="720" r="11"/>
  </g>
  <!-- Spotlights -->
  <polygon points="240,0 320,0 760,900 180,900" fill="url(#beamL)"/>
  <polygon points="1280,0 1360,0 1420,900 840,900" fill="url(#beamR)"/>
  <!-- Cozy couch silhouette centered at bottom -->
  <g transform="translate(520,730)" fill="#16063b" stroke="#111" stroke-width="6">
    <rect x="30" y="20" width="500" height="110" rx="34"/>
    <rect x="0" y="68" width="60" height="110" rx="26"/>
    <rect x="500" y="68" width="60" height="110" rx="26"/>
  </g>
  <!-- Floating comic stars -->
  <g fill="#ffd23f" stroke="#111" stroke-width="3" opacity="0.85">
    <polygon points="240,120 248,140 268,144 252,158 256,178 240,168 224,178 228,158 212,144 232,140"/>
    <polygon points="1350,150 1356,166 1372,170 1360,180 1363,196 1350,188 1337,196 1340,180 1328,170 1344,166"/>
  </g>
</svg>
